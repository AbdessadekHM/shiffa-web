<nav class="bg-neutral-50 dark:bg-neutral-900 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center">
          <h1 class="text-brand-500 logo-text text-2xl font-bold font-heading">Shifaa</h1>
        </a>
      </div>

      <!-- Navigation Links -->
      <div class="flex items-center space-x-8">
        @if (!isAuthenticated){

        <a  routerLink="/" class="text-neutral-700 dark:text-neutral-300 hover:text-brand-500 dark:hover:text-brand-400 transition-colors duration-200">Home</a>
        <a  href="#about-us" class="text-neutral-700 dark:text-neutral-300 hover:text-brand-500 dark:hover:text-brand-400 transition-colors duration-200">About Us</a>
        <a  href="#contact-us" class="text-neutral-700 dark:text-neutral-300 hover:text-brand-500 dark:hover:text-brand-400 transition-colors duration-200">Contact Us</a>
        <a  routerLink="/login" class="text-neutral-700 dark:text-neutral-300 hover:text-brand-500 dark:hover:text-brand-400 transition-colors duration-200">Login</a>
        }

        @if(isAuthenticated){
          <a *ngFor="let link of renderedNavBar" [routerLink]="link.path=='none'?'':link.path" (click)="link.name=='Logout'?signOut():print()" class="text-neutral-700 dark:text-neutral-300 hover:text-brand-500 dark:hover:text-brand-400 transition-colors duration-200">
            {{ link.name }}
          </a>
        }
        <!-- Theme Switcher -->
        
        <button 
          (click)="toggleTheme()" 
          class="p-2 rounded-lg hover:bg-neutral-200 dark:hover:bg-neutral-800 transition-colors duration-200"
          
          
        >
      <!--

          [attr.aria-label]="(isDarkMode$ | async) ? 'Switch to light mode' : 'Switch to dark mode'"
       -->
          <svg 
            *ngIf="!(isDarkMode$ | async)" 
            class="w-5 h-5 text-neutral-700" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg 
            *ngIf="isDarkMode$ | async" 
            class="w-5 h-5 text-neutral-300" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</nav>
