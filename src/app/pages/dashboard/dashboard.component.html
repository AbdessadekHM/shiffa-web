<div class="min-h-screen bg-gradient-to-br from-white to-neutral-50 transition-all duration-300">
  <!-- Sub Navigation Bar -->
  <div class="bg-white dark:bg-neutral-800 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex h-16">
        <div class="flex space-x-8">
          <button
            (click)="toggleTab('resources')"
            [class.text-brand-500]="activeTab === 'resources'"
            [class.text-neutral-500]="activeTab !== 'resources'"
            class="inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors duration-200"
            [class.border-brand-500]="activeTab === 'resources'"
            [class.border-transparent]="activeTab !== 'resources'"
          >
            Resources
          </button>
          <button
            (click)="toggleTab('accesses')"
            [class.text-brand-500]="activeTab === 'accesses'"
            [class.text-neutral-500]="activeTab !== 'accesses'"
            class="inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors duration-200"
            [class.border-brand-500]="activeTab === 'accesses'"
            [class.border-transparent]="activeTab !== 'accesses'"
          >
            Accesses
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Resources Tab Content -->
    <div *ngIf="activeTab === 'resources'" class="space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2">
        <app-add-card
          title="Add PDF"
          [acceptFileType]="'application/pdf'"
          [iconPath]="'M12 4v16m8-8H4'"
          (action)="onPdfSelected($event)"
        ></app-add-card>
        <app-add-card
          title="Add Analysis"
          [iconPath]="'M12 4v16m8-8H4'"
          (action)="onAnalysisRequested()"
        ></app-add-card>
      </div>
    </div>

    <!-- Accesses Tab Content -->
    <div *ngIf="activeTab === 'accesses'" class="space-y-6">
      <!-- Empty state for now -->
      <div class="text-center py-12">
        <p class="text-neutral-500 dark:text-neutral-400">No accesses to display</p>
      </div>
    </div>
  </div>

  <!-- AI Assistant Button -->
  <button
    (click)="toggleAssistant()"
    class="fixed bottom-8 right-8 w-16 h-16 rounded-full bg-brand-500 hover:bg-brand-600 text-white shadow-lg flex items-center justify-center transition-all duration-200 hover:shadow-xl"
  >
    <svg
      class="w-8 h-8"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
      />
    </svg>
  </button>

  <!-- AI Assistant Chat Window -->
  <div
    *ngIf="showAssistant"
    class="fixed bottom-24 right-8 w-96 bg-white dark:bg-neutral-800 rounded-lg shadow-xl border border-neutral-200 dark:border-neutral-700 transition-all duration-300 transform"
    [class.opacity-0]="!showAssistant"
    [class.translate-y-5]="!showAssistant"
  >
    <div class="p-4 border-b border-neutral-200 dark:border-neutral-700">
      <h3 class="text-lg font-medium text-neutral-900 dark:text-white">AI Assistant</h3>
    </div>
    <div class="p-4 max-h-96 overflow-y-auto scrollbar-thin scrollbar-thumb-neutral-300 dark:scrollbar-thumb-neutral-700 scrollbar-track-transparent">
      <!-- Chat content will go here -->
      <p class="text-neutral-500 dark:text-neutral-400">How can I help you today?</p>
    </div>
  </div>
</div>
