<div class="min-h-screen bg-white dark:bg-gray-900">
  <!-- Navbar -->
  <nav class="bg-white dark:bg-gray-800 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex">
          <div class="flex-shrink-0 flex items-center">
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Shifaa</h1>
          </div>
        </div>
        <div class="flex items-center">
          <button
            (click)="toggleAssistant()"
            class="ml-4 p-2 rounded-full text-brand-600 hover:text-brand-700 dark:text-brand-400 dark:hover:text-brand-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500"
          >
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <!-- Tabs -->
    <div class="border-b border-gray-200 dark:border-gray-700">
      <nav class="-mb-px flex space-x-8" aria-label="Tabs">
        <button
          (click)="toggleTab('resources')"
          [class]="activeTab === 'resources' ? 'border-brand-500 text-brand-600 dark:text-brand-400 dark:border-brand-400' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 dark:text-gray-400 dark:hover:text-gray-300'"
          class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm"
        >
          Resources
        </button>
        <button
          (click)="toggleTab('accesses')"
          [class]="activeTab === 'accesses' ? 'border-brand-500 text-brand-600 dark:text-brand-400 dark:border-brand-400' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 dark:text-gray-400 dark:hover:text-gray-300'"
          class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm"
        >
          Accesses
        </button>
        <button
          (click)="toggleTab('qr')"
          [class]="activeTab === 'qr' ? 'border-brand-500 text-brand-600 dark:text-brand-400 dark:border-brand-400' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 dark:text-gray-400 dark:hover:text-gray-300'"
          class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm"
        >
          QR Code
        </button>
      </nav>
    </div>

    <!-- Content -->
    <div class="mt-8">
      <!-- Resources Tab -->
      
      <div *ngIf="activeTab === 'resources'" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Add PDF Card -->
        <app-pdf-card
          [isAddCard]="true"
          (onAddClick)="openPdfUploadForm()"
        ></app-pdf-card>

        <!-- PDF Cards -->
         @if(pdfs!==null && pdfs.length > 0) {
          <app-pdf-card 
            *ngFor="let pdf of pdfs"
            [title]="pdf.name"
          ></app-pdf-card>
        }
      </div>

      <!-- Accesses Tab -->
      <div *ngIf="activeTab === 'accesses'" class="bg-white dark:bg-gray-800 shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
          <div class="flex justify-between items-center">
            <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white">Access Management</h3>
            <button
              (click)="openCreateAccessForm()"
              class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500"
            >
              Create Access
            </button>
          </div>
          <div class="mt-2 max-w-xl text-sm text-gray-500 dark:text-gray-400">
            <p>Manage who has access to your resources.</p>
          </div>
        </div>
      </div>

      <!-- QR Code Tab -->
      <div *ngIf="activeTab === 'qr'" class="bg-white dark:bg-gray-800 shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
          <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white">QR Code Generator</h3>
          <div class="mt-2 max-w-xl text-sm text-gray-500 dark:text-gray-400">
            <p>Generate QR codes for your resources.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- AI Assistant -->
  <div
    *ngIf="showAssistant"
    class="fixed bottom-4 right-4 w-96 bg-white dark:bg-gray-800 rounded-lg shadow-xl transition-all duration-300 transform"
    [class]="showAssistant ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'"
  >
    <div class="p-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium text-gray-900 dark:text-white">AI Assistant</h3>
        <button
          (click)="toggleAssistant()"
          class="text-brand-600 hover:text-brand-700 dark:text-brand-400 dark:hover:text-brand-300"
        >
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
      <div class="h-96 overflow-y-auto">
        <!-- Chat messages will go here -->
      </div>
      <div class="mt-4">
        <div class="flex rounded-md shadow-sm">
          <input
            type="text"
            class="flex-1 min-w-0 block w-full px-3 py-2 rounded-l-md border border-brand-200 dark:border-brand-800 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm dark:bg-gray-700 dark:text-white"
            placeholder="Type your message..."
          >
          <button
            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-r-md text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500"
          >
            Send
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- PDF Upload Form -->
  <app-pdf-upload-form
    *ngIf="showPdfUploadForm"
    (close)="closePdfUploadForm()"
    (submit)="onPdfSelected($event)"
  ></app-pdf-upload-form>
</div>
