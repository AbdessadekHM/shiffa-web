<!-- Hero Section -->
<section class="relative bg-gradient-to-br from-neutral-50 to-brand-50 overflow-hidden">
  <!-- Background Pattern -->
  <div class="absolute inset-0 bg-grid-pattern opacity-5"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
    <div class="flex flex-col lg:flex-row items-center justify-between py-16 lg:py-24 gap-12">
      <!-- Left Content -->
      <div class="flex-1 text-center lg:text-left">
        <h1 class="text-4xl lg:text-5xl xl:text-6xl font-bold text-neutral-900 mb-6">
          Transform Your Medical Analysis with 
          <span class="text-brand-500">AI-Powered Insights</span>
        </h1>
        <p class="text-lg lg:text-xl text-neutral-600 mb-8 max-w-2xl">
          Experience seamless medical analysis with our advanced AI technology. Get instant, accurate reports through simple QR code scanning.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
          <button class="px-8 py-4 bg-brand-500 text-white rounded-xl hover:bg-brand-600 transition-colors duration-300 font-medium text-lg shadow-lg shadow-brand-500/20">
            Get Started
          </button>
          <button class="px-8 py-4 bg-white text-brand-500 rounded-xl hover:bg-brand-50 transition-colors duration-300 font-medium text-lg border-2 border-brand-200">
            Learn More
          </button>
        </div>
        <!-- Trust Indicators -->
        <div class="mt-12 flex flex-wrap gap-8 justify-center lg:justify-start items-center text-neutral-600">
          <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-success-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>99.9% Accuracy</span>
          </div>
          <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-success-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <span>HIPAA Compliant</span>
          </div>
          <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-success-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span>Instant Results</span>
          </div>
        </div>
      </div>

      <!-- Right Content - Hero Image -->
      <div class="flex-1 relative">
        <div class="relative w-full aspect-square max-w-lg mx-auto">
          <!-- Main Image Container with Animation -->
          <div class="absolute inset-0 bg-gradient-to-br from-brand-100 to-accent-100 rounded-full animate-pulse-slow"></div>
          <img 
            src="assets/hero-medical.svg" 
            alt="AI Medical Analysis" 
            class="relative z-10 w-full h-full object-cover transform hover:scale-105 transition-transform duration-500"
          >
          <!-- Floating Elements -->
          <div class="absolute -top-4 -right-4 w-24 h-24 bg-success-500/10 rounded-full animate-float"></div>
          <div class="absolute -bottom-6 -left-6 w-32 h-32 bg-brand-500/10 rounded-full animate-float-delay"></div>
        </div>
      </div>
    </div>
  </div>
</section>
