<div class="bg-white dark:bg-gray-800 overflow-hidden shadow rounded-lg">
    <div class="p-4">
    <div *ngIf="isAddCard" class="w-full aspect-[4/3]">
        <button
        (click)="onAddClick.emit()"
        class="w-full h-full flex flex-col items-center justify-center border-2 border-dashed border-brand-200 dark:border-brand-800 rounded-lg hover:border-brand-500 dark:hover:border-brand-400 transition-colors duration-200"
        >
        <div class="flex flex-col items-center justify-center space-y-2">
            <svg class="h-12 w-12 text-brand-400 dark:text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span class="text-sm font-medium text-brand-600 dark:text-brand-400">Add PDF</span>
        </div>
        </button>
    </div>

    <div *ngIf="!isAddCard" class="w-full aspect-[4/3]">
        <div class="relative w-full h-full">
        <!-- PDF Thumbnail -->
        <div class="w-full h-3/4 bg-gray-100 dark:bg-gray-700 rounded-t-lg overflow-hidden">
            <img *ngIf="thumbnailUrl" [src]="thumbnailUrl" alt="PDF thumbnail" class="w-full h-full object-cover" />
            <div *ngIf="!thumbnailUrl" class="w-full h-full flex items-center justify-center">
            <svg class="h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            </div>
        </div>
            
        <!-- PDF Info -->
        <div class="p-3">
            <h3 class="text-sm font-medium text-brand-600 dark:text-brand-400 truncate">{{title}}</h3>
            <p *ngIf="description" class="mt-1 text-xs text-gray-500 dark:text-gray-400 line-clamp-2">{{description}}</p>
        </div>
        </div>
    </div>
    </div>
</div>
