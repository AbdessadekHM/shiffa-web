<!-- Contact Us Section -->
<section class="py-20 bg-gradient-to-b from-white to-neutral-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid lg:grid-cols-2 gap-12 items-center">
      <!-- Contact Information -->
      <div class="space-y-8">
        <div>
          <h2 class="text-3xl lg:text-4xl font-bold text-neutral-900 mb-4">
            Get in Touch with 
            <span class="text-brand-500">Our Team</span>
          </h2>
          <p class="text-lg text-neutral-600">
            Have questions about our AI-powered medical analysis platform? We're here to help.
          </p>
        </div>

        <!-- Contact Cards -->
        <div class="space-y-6">
          <!-- Email -->
          <div class="flex items-start space-x-4 p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300">
            <div class="w-12 h-12 bg-brand-50 rounded-lg flex items-center justify-center flex-shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-neutral-900">Email Us</h3>
              <p class="text-neutral-600">support@shifaa.ai</p>
            </div>
          </div>

          <!-- Phone -->
          <div class="flex items-start space-x-4 p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300">
            <div class="w-12 h-12 bg-accent-50 rounded-lg flex items-center justify-center flex-shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-accent-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-neutral-900">Call Us</h3>
              <p class="text-neutral-600">+1 (555) 123-4567</p>
            </div>
          </div>

          <!-- Location -->
          <div class="flex items-start space-x-4 p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300">
            <div class="w-12 h-12 bg-success-50 rounded-lg flex items-center justify-center flex-shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-success-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-neutral-900">Visit Us</h3>
              <p class="text-neutral-600">123 Healthcare Ave, Tech City, TC 12345</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="bg-white p-8 rounded-2xl shadow-lg">
        <form class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-medium text-neutral-700">Full Name</label>
            <input type="text" id="name" name="name" class="mt-1 block w-full rounded-lg border-neutral-300 shadow-sm focus:border-brand-500 focus:ring-brand-500">
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-neutral-700">Email Address</label>
            <input type="email" id="email" name="email" class="mt-1 block w-full rounded-lg border-neutral-300 shadow-sm focus:border-brand-500 focus:ring-brand-500">
          </div>
          <div>
            <label for="subject" class="block text-sm font-medium text-neutral-700">Subject</label>
            <input type="text" id="subject" name="subject" class="mt-1 block w-full rounded-lg border-neutral-300 shadow-sm focus:border-brand-500 focus:ring-brand-500">
          </div>
          <div>
            <label for="message" class="block text-sm font-medium text-neutral-700">Message</label>
            <textarea id="message" name="message" rows="4" class="mt-1 block w-full rounded-lg border-neutral-300 shadow-sm focus:border-brand-500 focus:ring-brand-500"></textarea>
          </div>
          <div>
            <button type="submit" class="w-full bg-brand-500 text-white py-3 px-4 rounded-lg hover:bg-brand-600 transition-colors duration-300 font-medium">
              Send Message
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
