<div class="min-h-screen bg-gradient-to-b from-neutral-50 to-white flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-bold text-neutral-900">Create Your Account</h2>
      <p class="mt-2 text-sm text-neutral-600">
        Join Shifaa to access our AI-powered medical analysis platform
      </p>
    </div>

    <!-- Registration Form -->
    <form class="mt-8 space-y-6" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <!-- Name Fields -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="block text-sm font-medium text-neutral-700">First Name</label>
            <input 
              id="firstName" 
              name="firstName" 
              type="text" 
              formControlName="firstName"
              class="mt-1 block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
              placeholder="First name"
            >
          </div>
          <div>
            <label for="lastName" class="block text-sm font-medium text-neutral-700">Last Name</label>
            <input 
              id="lastName" 
              name="lastName" 
              type="text" 
              formControlName="lastName"
              class="mt-1 block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
              placeholder="Last name"
            >
          </div>
        </div>

        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-neutral-700">Email Address</label>
          <input 
            id="email" 
            name="email" 
            type="email" 
            formControlName="email"
            class="mt-1 block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
            placeholder="Enter your email"
          >
        </div>

        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-medium text-neutral-700">Username</label>
          <input 
            id="username" 
            name="username" 
            type="text" 
            formControlName="username"
            class="mt-1 block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
            placeholder="Choose a username"
          >
        </div>

        <!-- Password Fields -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="password" class="block text-sm font-medium text-neutral-700">Password</label>
            <input 
              id="password" 
              name="password" 
              type="password" 
              formControlName="password"
              class="mt-1 block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
              placeholder="Create password"
            >
          </div>
          <div>
            <label for="verifyPassword" class="block text-sm font-medium text-neutral-700">Verify Password</label>
            <input 
              id="verifyPassword" 
              name="verifyPassword" 
              type="password" 
              formControlName="verifyPassword"
              class="mt-1 block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
              placeholder="Confirm password"
            >
          </div>
        </div>

        <!-- User Type Selection -->
        <div>
          <label class="block text-sm font-medium text-neutral-700 mb-2">Account Type</label>
          <div class="flex space-x-4">
            <label class="inline-flex items-center">
              <input 
                type="radio" 
                name="userType" 
                value="user" 
                formControlName="userType"
                class="h-4 w-4 text-brand-500 focus:ring-brand-500 border-neutral-300"
              >
              <span class="ml-2 text-sm text-neutral-700">User</span>
            </label>
            <label class="inline-flex items-center">
              <input 
                type="radio" 
                name="userType" 
                value="doctor" 
                formControlName="userType"
                class="h-4 w-4 text-brand-500 focus:ring-brand-500 border-neutral-300"
              >
              <span class="ml-2 text-sm text-neutral-700">Doctor</span>
            </label>
          </div>
        </div>

        <!-- Doctor Description (Conditional) -->
        <div *ngIf="registerForm.get('userType')?.value === 'doctor'" class="space-y-2">
          <label for="description" class="block text-sm font-medium text-neutral-700">Professional Description</label>
          <textarea 
            id="description" 
            name="description" 
            formControlName="description"
            rows="4"
            class="mt-1 block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
            placeholder="Describe your professional background and expertise (max 250 words)"
          ></textarea>
          <p class="text-xs text-neutral-500 text-right">
            {{ registerForm.get('description')?.value?.length || 0 }}/250 words
          </p>
        </div>
      </div>

      <!-- Sign Up Button -->
      <div>
        <button 
          type="submit" 
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-brand-500 hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors duration-200"
        >
          Sign Up
        </button>
      </div>

      <!-- Login Link -->
      <div class="text-center">
        <p class="text-sm text-neutral-600">
          Already have an account? 
          <a routerLink="/login" class="font-medium text-brand-500 hover:text-brand-600">
            Sign in
          </a>
        </p>
      </div>
    </form>
  </div>
</div>
