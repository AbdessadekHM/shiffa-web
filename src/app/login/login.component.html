<div class="min-h-screen bg-gradient-to-b from-neutral-50 to-white flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-bold text-neutral-900">Welcome Back</h2>
      <p class="mt-2 text-sm text-neutral-600">
        Sign in to your account to continue
      </p>
    </div>

    <!-- Login Form -->
    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-medium text-neutral-700">Username</label>
          <div class="mt-1">
            <input 
              id="username" 
              name="username" 
              type="text" 
              formControlName="username"
              class="appearance-none block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
              placeholder="Enter your username"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-neutral-700">Password</label>
          <div class="mt-1">
            <input 
              id="password" 
              name="password" 
              type="password" 
              formControlName="password"
              class="appearance-none block w-full px-3 py-2 border border-neutral-300 rounded-lg shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500"
              placeholder="Enter your password"
            >
          </div>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input 
            id="remember-me" 
            name="remember-me" 
            type="checkbox" 
            class="h-4 w-4 text-brand-500 focus:ring-brand-500 border-neutral-300 rounded"
          >
          <label for="remember-me" class="ml-2 block text-sm text-neutral-700">
            Remember me
          </label>
        </div>

        <div class="text-sm">
          <a href="#" class="font-medium text-brand-500 hover:text-brand-600">
            Forgot your password?
          </a>
        </div>
      </div>

      <!-- Login Button -->
      <div>
        <button 
          type="submit" 
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-brand-500 hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors duration-200"
        >
          Sign in
        </button>
      </div>

      <!-- Create Account Link -->
      <div class="text-center">
        <p class="text-sm text-neutral-600">
          Don't have an account? 
          <a href="/register" class="font-medium text-brand-500 hover:text-brand-600">
            Create one now
          </a>
        </p>
      </div>
    </form>
  </div>
</div>
